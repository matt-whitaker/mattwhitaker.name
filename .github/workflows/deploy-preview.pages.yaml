name: Deploy Preview (GitHub Pages)
run-name: "Deploy Preview (GitHub Pages) · ${{ github.ref_name }}"

# Manual only — never fires on its own. Pick any branch from the Actions tab,
# including a pull request's head branch. GitHub Pages serves one site per
# repo, so each run replaces whatever preview is currently published.
on:
  workflow_dispatch:

env:
  NODE_VERSION: 24
  # The preview is served here, and the build is pinned to it. Resolving the
  # URL from the Pages API instead produced a github.io subpath and shipped a
  # site whose every asset 404'd at this domain.
  PREVIEW_DOMAIN: preview.mattwhitaker.name

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race; queue instead of cancelling so a
# deploy that is already publishing is not left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Resolves the repo's actual Pages URL, so the build targets wherever
      # Pages is really served — repo subpath or a custom domain at the root.
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # Pages must agree that PREVIEW_DOMAIN is this site, or it serves at the
      # github.io subpath and every asset built below 404s. A DNS record alone
      # does not do that — the domain has to be set in Settings > Pages.
      - name: Require the custom domain to be registered
        run: |
          resolved=$(printf '%s' "${{ steps.pages.outputs.origin }}" | sed -E 's#^https?://##; s#/$##')
          if [ "$resolved" != "$PREVIEW_DOMAIN" ]; then
            echo "::error::Pages resolves to '$resolved', not '$PREVIEW_DOMAIN'. Set Settings > Pages > Custom domain to $PREVIEW_DOMAIN; a DNS CNAME alone is not enough. Deploying now would publish a site whose assets 404."
            exit 1
          fi
          echo "Pages resolves to $resolved."

      # Not `npm run build:www`: the URL has to reach `astro build` as
      # --site/--base, and the root script cannot forward arguments through
      # its workspace indirection. Base is `/` because a custom domain serves
      # at its own root.
      - name: Build www for the preview domain
        working-directory: packages/www
        run: npx astro build --site "https://$PREVIEW_DOMAIN" --base "/"

      # The exact failure this workflow shipped once: assets built for a
      # subpath, served from the root.
      - name: Assert assets are root-relative
        working-directory: packages/www
        run: |
          if grep -qE '(href|src)="/[^"]*/_astro/' dist/index.html; then
            echo "::error::Built assets carry a path prefix; they will 404 at the domain root."
            grep -oE '(href|src)="[^"]*_astro[^"]*"' dist/index.html | sort -u
            exit 1
          fi
          grep -oE '(href|src)="/_astro/[^"]*"' dist/index.html | sort -u

      # Keeps the custom domain attached to what this workflow publishes.
      - name: Write the CNAME
        run: echo "$PREVIEW_DOMAIN" > packages/www/dist/CNAME

      # A preview of the real site is duplicate content; keep it unindexed
      # so it cannot compete with mattwhitaker.name in search results.
      - name: Keep the preview out of search results
        run: |
          printf 'User-agent: *\nDisallow: /\n' > packages/www/dist/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/www/dist

  Deploy:
    needs: ["Build"]
    runs-on: ubuntu-latest
    # Adding required reviewers to this environment turns the deploy into a
    # job that waits for a human approval click — GitHub's only mechanism for
    # a manual job, and it needs no change here.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
