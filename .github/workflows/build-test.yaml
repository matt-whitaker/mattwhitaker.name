name: Build and Test
run-name: "Build and Test"

on:
  push:
    branches-ignore:
      - develop
      - mainline

env:
  NODE_VERSION: 18

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build
      - run: npm run pack:dev
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  Test:
    runs-on: ubuntu-latest
    needs: ["Build"]
    steps:
      - run: echo "No tests yet..."