name: Test Server Workflow

on: [push]

env:
  NODE_VERSION: 18

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build -w packages/resume
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/resume/dist

  Server:
    runs-on: ubuntu-latest
    needs: ["Build"]
    outputs:
      server-status: ${{ steps.wait-for-server.outputs.server-status }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages/resume/dist
      - run: npm run serve -w packages/resume &
      - id: wait-for-server
        run: |
          until curl -s http://localhost:8080; do
            sleep 2
          done
      - run: npm run generate:all -w packages/resume
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/resume/dist
